[package]
name = "gcode-thumb"
version = "0.1.0"
edition = "2024"
description = "G-code file thumbnailer that can extract embedded thumbnails or render one from code."
authors = ["Matthieu Laurent"]
keywords = ["gcode", "thumbnail"]
categories = ["command-line-utilities"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Matthieu-LAURENT39/gcode-thumb"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
ere = "0.2.4"
# disable default features (alloc and serde) as we don't want them
gcode = { version = "0.7.0", default-features = false }
image = "0.25.10"
log = "0.4.29"
tiny-skia = "0.12.0"
visibility = "0.1.1"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[features]
# Internal feature to expose some of the inner structures for benchmarking.
# This is not a stable public API and you should not rely on it.
_bench = []

[[bench]]
name = "render_thumbnail"
harness = false
required-features = ["_bench"]


[package.metadata.deb]
license-file = "LICENSE"
assets = [
    # Install the binary
    "$auto",
    # Install the thumbnailer
    ["assets/gcode-thumb.thumbnailer", "usr/share/thumbnailers/", "644"],
]
